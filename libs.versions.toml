[versions]
    java = "21"
    kotlin = "2.3.21"
    fabric_loom = "1.10-SNAPSHOT"
    iridium = "3.5.0"
    # Dependencies
#    minecraft = "1.21.1"
#    fabric_loader = "0.19.2"
#    fabric_api = "0.116.12+1.21.1"
#    fabric_kotlin = "1.13.11+kotlin.2.3.21"
    fzzy_config = "0.7.6+1.21"
    biolith = "3.0.1"
    reef = "0.2.0-beta.2"
    voidmill = "1.0.4"
    taglighting = "1.0.0+1.21.1"
    # Compatibility
    # Runtime
    modmenu = "11.0.3"
    emi = "1.1.24+1.21.1"
    # Testing
    creative_works = "0.5.0"
    imguimc = "1.21.1-1.0.8"

[libraries]
    # Dependencies
#    minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
#    fabric_loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric_loader" }
#    fabric_api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric_api" }
#    fabric_kotlin = { module = "net.fabricmc:fabric-language-kotlin", version.ref = "fabric_kotlin" }
    fzzy-config = { module = "me.fzzyhmstrs:fzzy_config", version.ref = "fzzy_config" }
    biolith = { module = "com.terraformersmc:biolith-fabric", version.ref = "biolith" }
    reef = { module = "org.teamvoided:reef", version.ref = "reef" }
    voidmill = { module = "org.teamvoided:voidmill", version.ref = "voidmill" }
    taglighting = { module = "org.teamvoided:taglighting", version.ref = "taglighting" }
    # Compatibility
    # Runtime
    modmenu = { module = "com.terraformersmc:modmenu", version.ref = "modmenu" }
    emi = { module = "dev.emi:emi-fabric", version.ref = "emi" }
    # Testing
    creative-works = { module = "org.teamvoided:creative_works", version.ref = "creative_works" }
    imguimc = { module = "maven.modrinth:imgui-mc", version.ref = "imguimc" }
[bundles]
    cw = [ "creative-works", "imguimc" ]

[plugins]
    kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
    # kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
    fabric-loom = { id = "fabric-loom", version.ref = "fabric_loom" }
    iridium = { id = "org.teamvoided.iridium", version.ref = "iridium" }
    iridium-publish = { id = "iridium.project.publish-script", version.ref = "iridium" }
    iridium-upload = { id = "iridium.mod.upload-script", version.ref = "iridium" }